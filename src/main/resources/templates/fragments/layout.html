<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Shared fragments for every page -->

<!-- ===== <head> assets (call inside <head>) ===== -->
<th:block th:fragment="assets">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Base path of the site ("/" locally, "/<repo>/" on GitHub Pages); read by the JS -->
    <meta name="app-base" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/User/image/favicon.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/User/css/site.css(v=3)}">
    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
        try { var t = localStorage.getItem('portfolio-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
</th:block>

<!-- ===== Header ===== -->
<header class="site-header" th:fragment="header(active)">
    <a href="#main" class="skip-link">Skip to content</a>
    <div class="container">
        <a th:href="@{/}" class="avatar-link" aria-label="Home">
            <img th:src="@{/User/image/profile.jpg}" alt="Phan Tien Thinh">
        </a>

        <nav class="nav-pill" aria-label="Main">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
            <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'active'">About</a>
            <a th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active'">Projects</a>
            <a th:href="@{/expertise}" th:classappend="${active == 'expertise'} ? 'active'">Expertise</a>
            <a th:href="@{/gear}" th:classappend="${active == 'gear'} ? 'active'">Gear</a>
        </nav>

        <div class="header-actions">
            <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-nav">
                Menu
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>

        <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
            <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'active'">About</a>
            <a th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active'">Projects</a>
            <a th:href="@{/expertise}" th:classappend="${active == 'expertise'} ? 'active'">Expertise</a>
            <a th:href="@{/gear}" th:classappend="${active == 'gear'} ? 'active'">Gear</a>
        </nav>
    </div>
</header>

</div>

<!-- ===== Footer ===== -->
<footer class="site-footer" th:fragment="footer">
    <div class="container">
        <nav class="footer-links" aria-label="Footer">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/about}">About</a>
            <a th:href="@{/projects}">Projects</a>
            <a th:href="@{/expertise}">Expertise</a>
            <a th:href="@{/gear}">Gear</a>
            <a href="mailto:phantienthinh0909@gmail.com">Email</a>
        </nav>
        <p class="footer-copy">&copy; <span id="year">2026</span> Phan Tien Thinh. Built with Spring Boot.</p>
    </div>
</footer>

<!-- ===== Scripts shared by every page ===== -->
<th:block th:fragment="scripts">
    <script th:src="@{/User/Js/theme.js(v=3)}"></script>
</th:block>

</html>
