<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<body>

            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

<main id="project-detail-content">
    <!-- Loading / fallback state, sẽ bị JS ghi đè -->
    <div class="detail-loading">

<!-- Footer -->
<footer class="footer" id="footer">
    <p class="footer-text">&copy; 2026 Phan Tien Thinh</p>
</footer>

<script th:src="@{/User/Js/theme.js}" src="User/Js/theme.js"></script>
<script th:src="@{/User/Js/projects-data.js(v=2)}" src="User/Js/projects-data.js?v=2"></script>
