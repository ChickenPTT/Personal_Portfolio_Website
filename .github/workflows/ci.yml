name: CI

# Runs on every push / pull request to these branches
on:
  push:
    branches: [ main, MyPortfolio_V2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-war
          path: target/*.war
          retention-days: 7
